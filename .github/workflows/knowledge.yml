name: Validate knowledge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build knowledge registries
        run: node tools/ros_cli.mjs registry build
      - name: Check generated registries
        run: git diff --exit-code -- registries/
      - name: Validate knowledge
        run: node tools/ros_cli.mjs validate
